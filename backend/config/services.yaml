# Configuration des services (les classes de src/ sont injectables automatiquement)
parameters:
    # No ADMIN_PIN at all: the admin view refuses every PIN instead of crashing.
    env(ADMIN_PIN): ''
    # "dev,network" (a real game) or "dev" (dev-only fallback, affinity null).
    env(GAME_TRACKS): 'dev,network'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Dto/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Random source of the bug draw; tests can swap it for a seeded one.
    Random\Randomizer: ~
