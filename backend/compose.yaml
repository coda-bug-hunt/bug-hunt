services:
  # Le serveur web + PHP (FrankenPHP) qui fait tourner Symfony
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # On tourne avec ton utilisateur pour que les fichiers créés (make entity, composer...) t'appartiennent
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      SERVER_NAME: ":8080"
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/app
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      database:
        condition: service_healthy

  # La base de données
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Interface web pour voir et modifier la base
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - database

volumes:
  database_data:
