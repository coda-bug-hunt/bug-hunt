name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Validate game content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that every bug file is valid JSON
        run: |
          shopt -s globstar nullglob
          status=0
          for file in data/bugs/**/*.json; do
            if ! jq empty "$file"; then
              echo "::error file=$file::Invalid JSON"
              status=1
            fi
          done
          exit $status

  frontend:
    name: Front end - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Type-check and build
        run: npm run build

  # back: lint and tests, to add once the stack is chosen
