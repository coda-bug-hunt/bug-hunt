name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    name: Validate game content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that every bug file is valid JSON
        run: |
          shopt -s globstar nullglob
          status=0
          for file in data/bugs/**/*.json; do
            if ! jq empty "$file"; then
              echo "::error file=$file::Invalid JSON"
              status=1
            fi
          done
          exit $status

  frontend:
    name: Front end - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Type-check and build
        run: npm run build

  backend:
    # The required check of the protect-main ruleset uses this exact name.
    name: Back end - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same server as backend/compose.yaml; root:root is the one of .env.test.
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      # The host "database" only exists inside Compose. A real variable wins over the .env files.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl
          coverage: none

      - name: Find the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Symfony refuses to boot without a .env; the example holds harmless defaults.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Create and migrate the test database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      # A mapping change without its migration fails here.
      - name: Check that the migrations match the entities
        run: php bin/console doctrine:schema:validate

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Test
        run: vendor/bin/phpunit
